<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280">
  <!-- Background -->
  <ellipse cx="160" cy="148" rx="128" ry="112" fill="#FFF3E0"/>
  <ellipse cx="230" cy="80" rx="55" ry="48" fill="#FFE0B2"/>

  <!-- Phone frame -->
  <rect x="88" y="30" width="105" height="185" rx="18" fill="#1A1A2E"/>
  <rect x="94" y="40" width="93" height="165" rx="12" fill="white"/>
  <!-- Notch -->
  <rect x="122" y="34" width="37" height="6" rx="3" fill="#333"/>

  <!-- Report header on phone -->
  <rect x="94" y="40" width="93" height="30" rx="12" fill="#0A5C4A"/>
  <rect x="94" y="58" width="93" height="12" fill="#0A5C4A"/>
  <text x="108" y="56" font-size="8" fill="white" font-weight="bold">Lab Report</text>
  <text x="108" y="65" font-size="7" fill="rgba(255,255,255,0.7)">MicroLab · 14 May 2026</text>

  <!-- Report rows -->
  <!-- Row 1 -->
  <rect x="100" y="76" width="81" height="18" rx="4" fill="#F5F5F5"/>
  <text x="104" y="88" font-size="7" fill="#333" font-weight="600">HbA1c</text>
  <text x="148" y="88" font-size="7" fill="#0A5C4A" font-weight="700">5.4%</text>
  <rect x="163" y="81" width="12" height="8" rx="2" fill="#E8F5F1"/>
  <text x="164" y="87" font-size="5.5" fill="#0A5C4A">Normal</text>
  <!-- Row 2 -->
  <rect x="100" y="98" width="81" height="18" rx="4" fill="#F5F5F5"/>
  <text x="104" y="110" font-size="7" fill="#333" font-weight="600">Glucose</text>
  <text x="148" y="110" font-size="7" fill="#E65100" font-weight="700">112</text>
  <rect x="163" y="103" width="12" height="8" rx="2" fill="#FFF3E0"/>
  <text x="164" y="109" font-size="5.5" fill="#E65100">High</text>
  <!-- Row 3 -->
  <rect x="100" y="120" width="81" height="18" rx="4" fill="#F5F5F5"/>
  <text x="104" y="132" font-size="7" fill="#333" font-weight="600">Cholesterol</text>
  <text x="148" y="132" font-size="7" fill="#0A5C4A" font-weight="700">178</text>
  <rect x="163" y="125" width="12" height="8" rx="2" fill="#E8F5F1"/>
  <text x="164" y="131" font-size="5.5" fill="#0A5C4A">Normal</text>

  <!-- Mini chart bars -->
  <rect x="100" y="144" width="81" height="36" rx="4" fill="#F9F9F9"/>
  <rect x="106" y="164" width="9" height="12" rx="2" fill="#B2DFDB"/>
  <rect x="118" y="158" width="9" height="18" rx="2" fill="#0A5C4A"/>
  <rect x="130" y="162" width="9" height="14" rx="2" fill="#B2DFDB"/>
  <rect x="142" y="155" width="9" height="21" rx="2" fill="#0A5C4A"/>
  <rect x="154" y="160" width="9" height="16" rx="2" fill="#B2DFDB"/>
  <rect x="166" y="153" width="9" height="23" rx="2" fill="#0A5C4A"/>

  <!-- Download button -->
  <rect x="100" y="186" width="81" height="14" rx="7" fill="#0A5C4A"/>
  <text x="124" y="196" font-size="7" fill="white" font-weight="600">↓ Download</text>

  <!-- Notification bubble -->
  <rect x="200" y="48" width="88" height="44" rx="12" fill="white" stroke="#0A5C4A" stroke-width="1.5"/>
  <!-- Triangle pointer -->
  <polygon points="200,62 212,56 212,68" fill="white"/>
  <polygon points="200,62 210.5,56.5 210.5,67.5" fill="white" stroke="#0A5C4A" stroke-width="0" />
  <line x1="200" y1="56.5" x2="200" y2="67.5" stroke="white" stroke-width="2.5"/>
  <circle cx="214" cy="60" r="6" fill="#0A5C4A"/>
  <text x="211" y="63" font-size="8" fill="white" font-weight="bold">!</text>
  <text x="224" y="62" font-size="8" fill="#0A5C4A" font-weight="700">Report Ready</text>
  <text x="224" y="74" font-size="7" fill="#666">Your results are in</text>

  <!-- Person receiving notification (simple) -->
  <circle cx="258" cy="158" r="20" fill="#FDBCB4"/>
  <ellipse cx="258" cy="144" rx="18" ry="9" fill="#2D1B00"/>
  <rect x="240" y="176" width="36" height="44" rx="10" fill="#1565C0"/>
  <!-- Happy expression -->
  <circle cx="250" cy="157" r="3" fill="#555"/>
  <circle cx="266" cy="157" r="3" fill="#555"/>
  <path d="M250,166 Q258,173 266,166" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating dots -->
  <circle cx="60" cy="70" r="5" fill="#FFB300" opacity="0.4"/>
  <circle cx="42" cy="195" r="7" fill="#0A5C4A" opacity="0.15"/>
  <circle cx="288" cy="220" r="4" fill="#E65100" opacity="0.3"/>
</svg>
