<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280">
  <!-- Background blobs -->
  <ellipse cx="155" cy="155" rx="125" ry="108" fill="#EEF4FB"/>
  <ellipse cx="85" cy="90" rx="55" ry="50" fill="#D6E8FB"/>

  <!-- Technician figure -->
  <!-- Head -->
  <circle cx="160" cy="82" r="30" fill="#FDBCB4"/>
  <!-- Hair -->
  <ellipse cx="160" cy="67" rx="28" ry="14" fill="#1A0500"/>
  <!-- Stethoscope -->
  <path d="M148,108 Q135,130 140,148 Q145,160 155,158" fill="none" stroke="#1565C0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="155" cy="160" r="7" fill="none" stroke="#1565C0" stroke-width="2.5"/>
  <circle cx="155" cy="160" r="3" fill="#1565C0"/>
  <!-- Body / lab coat -->
  <rect x="128" y="110" width="64" height="80" rx="14" fill="white" stroke="#BBDEFB" stroke-width="1.5"/>
  <!-- Coat pocket -->
  <rect x="133" y="128" width="18" height="14" rx="3" fill="#E3F2FD"/>
  <!-- ID badge -->
  <rect x="154" y="124" width="22" height="16" rx="3" fill="#1565C0"/>
  <rect x="157" y="127" width="16" height="3" rx="1" fill="white" opacity="0.8"/>
  <rect x="157" y="132" width="10" height="2" rx="1" fill="white" opacity="0.5"/>
  <!-- Arms -->
  <rect x="104" y="112" width="26" height="50" rx="13" fill="white" stroke="#BBDEFB" stroke-width="1.5"/>
  <rect x="190" y="112" width="26" height="50" rx="13" fill="white" stroke="#BBDEFB" stroke-width="1.5"/>
  <!-- Hands -->
  <circle cx="117" cy="164" r="10" fill="#FDBCB4"/>
  <circle cx="203" cy="164" r="10" fill="#FDBCB4"/>
  <!-- Legs -->
  <rect x="134" y="188" width="24" height="50" rx="10" fill="#1565C0"/>
  <rect x="162" y="188" width="24" height="50" rx="10" fill="#1565C0"/>

  <!-- Medical kit in right hand -->
  <rect x="196" y="152" width="38" height="28" rx="5" fill="#0A5C4A"/>
  <rect x="204" y="148" width="22" height="6" rx="3" fill="#0A5C4A"/>
  <!-- Kit cross -->
  <rect x="211" y="161" width="12" height="4" rx="2" fill="white"/>
  <rect x="214" y="158" width="4" height="10" rx="2" fill="white"/>

  <!-- Verified badge (top right) -->
  <circle cx="262" cy="68" r="28" fill="#0A5C4A"/>
  <circle cx="262" cy="68" r="22" fill="white" opacity="0.15"/>
  <polyline points="250,68 258,76 274,60" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
