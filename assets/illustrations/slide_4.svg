<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280">
  <!-- Background -->
  <ellipse cx="158" cy="148" rx="130" ry="112" fill="#F3E5F5"/>
  <ellipse cx="80" cy="85" rx="55" ry="48" fill="#E1BEE7"/>

  <!-- Wallet body -->
  <rect x="70" y="95" width="155" height="110" rx="16" fill="#6A1B9A"/>
  <rect x="70" y="95" width="155" height="110" rx="16" fill="url(#walletGrad)"/>
  <defs>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B1FA2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A148C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Wallet flap -->
  <rect x="70" y="95" width="155" height="42" rx="16" fill="#8E24AA"/>
  <rect x="70" y="122" width="155" height="15" fill="#8E24AA"/>
  <!-- Wallet clasp pocket -->
  <rect x="175" y="108" width="58" height="40" rx="10" fill="#6A1B9A"/>
  <rect x="178" y="111" width="52" height="34" rx="8" fill="#4A148C"/>
  <!-- Coin inside clasp -->
  <circle cx="204" cy="128" r="12" fill="#FFB300"/>
  <circle cx="204" cy="128" r="9" fill="#FFC107"/>
  <text x="198" y="132" font-size="11" fill="#5D4037" font-weight="bold">₹</text>

  <!-- Money notes flying out -->
  <!-- Note 1 -->
  <rect x="105" y="55" width="68" height="38" rx="5" fill="#66BB6A" transform="rotate(-12 139 74)"/>
  <rect x="108" y="58" width="62" height="32" rx="3" fill="#81C784" transform="rotate(-12 139 74)"/>
  <text x="118" y="74" font-size="9" fill="#1B5E20" font-weight="bold" transform="rotate(-12 139 74)">₹500</text>
  <circle cx="126" cy="72" r="7" fill="#A5D6A7" transform="rotate(-12 139 74)"/>
  <text x="122" y="75" font-size="7" fill="#1B5E20" transform="rotate(-12 139 74)">₹</text>

  <!-- Note 2 -->
  <rect x="155" y="42" width="68" height="38" rx="5" fill="#66BB6A" transform="rotate(8 189 61)"/>
  <rect x="158" y="45" width="62" height="32" rx="3" fill="#81C784" transform="rotate(8 189 61)"/>
  <text x="166" y="63" font-size="9" fill="#1B5E20" font-weight="bold" transform="rotate(8 189 61)">₹500</text>
  <circle cx="178" cy="62" r="7" fill="#A5D6A7" transform="rotate(8 189 61)"/>
  <text x="174" y="65" font-size="7" fill="#1B5E20" transform="rotate(8 189 61)">₹</text>

  <!-- 1000 label -->
  <circle cx="160" cy="220" r="38" fill="#FFB300"/>
  <circle cx="160" cy="220" r="32" fill="#FFC107"/>
  <text x="142" y="216" font-size="11" fill="#4E342E" font-weight="800">₹1000</text>
  <text x="141" y="229" font-size="8" fill="#5D4037" font-weight="600">Wallet Cash</text>

  <!-- Sparkles -->
  <text x="58" y="90" font-size="22" fill="#FFB300" opacity="0.7">✦</text>
  <text x="255" y="72" font-size="16" fill="#FFB300" opacity="0.5">✦</text>
  <text x="270" y="165" font-size="12" fill="#6A1B9A" opacity="0.3">✦</text>
  <text x="42" y="175" font-size="10" fill="#6A1B9A" opacity="0.25">✦</text>

  <!-- Person holding wallet (right side) -->
  <circle cx="268" cy="145" r="17" fill="#FDBCB4"/>
  <ellipse cx="268" cy="133" rx="16" ry="8" fill="#2D1B00"/>
  <rect x="252" y="160" width="32" height="40" rx="9" fill="#6A1B9A"/>
  <!-- Arms -->
  <line x1="252" y1="168" x2="238" y2="180" stroke="#FDBCB4" stroke-width="7" stroke-linecap="round"/>
  <line x1="284" y1="168" x2="298" y2="175" stroke="#FDBCB4" stroke-width="7" stroke-linecap="round"/>
</svg>
