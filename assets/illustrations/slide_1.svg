<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280">
  <!-- Background blobs -->
  <ellipse cx="160" cy="148" rx="130" ry="110" fill="#E8F5F1"/>
  <ellipse cx="235" cy="95" rx="62" ry="54" fill="#C8EBE2"/>

  <!-- Map card -->
  <rect x="82" y="62" width="158" height="148" rx="14" fill="white" stroke="#0A5C4A" stroke-width="2"/>

  <!-- Map bg -->
  <rect x="82" y="62" width="158" height="100" rx="14" fill="#EEF7F4"/>
  <rect x="82" y="148" width="158" height="14" fill="#EEF7F4"/>

  <!-- Road grid -->
  <line x1="82" y1="95" x2="240" y2="95" stroke="white" stroke-width="5"/>
  <line x1="82" y1="130" x2="240" y2="130" stroke="white" stroke-width="5"/>
  <line x1="130" y1="62" x2="130" y2="162" stroke="white" stroke-width="5"/>
  <line x1="185" y1="62" x2="185" y2="162" stroke="white" stroke-width="5"/>

  <!-- Green blocks (buildings) -->
  <rect x="88" y="68" width="38" height="22" rx="4" fill="#B2DFDB" opacity="0.55"/>
  <rect x="136" y="68" width="44" height="22" rx="4" fill="#B2DFDB" opacity="0.45"/>
  <rect x="190" y="68" width="44" height="22" rx="4" fill="#B2DFDB" opacity="0.5"/>
  <rect x="88" y="100" width="38" height="26" rx="4" fill="#B2DFDB" opacity="0.4"/>
  <rect x="190" y="100" width="44" height="26" rx="4" fill="#B2DFDB" opacity="0.45"/>

  <!-- Dashed route path from tech → home -->
  <path d="M200,120 Q175,115 161,108 Q148,100 138,90" fill="none" stroke="#0A5C4A" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>

  <!-- Destination pin (home) -->
  <path d="M129,80 Q129,70 134,70 Q139,70 139,80 Q139,88 134,93 Q129,88 129,80 Z" fill="#0A5C4A"/>
  <circle cx="134" cy="79" r="3.5" fill="white"/>
  <!-- Pulse rings -->
  <circle cx="134" cy="79" r="10" fill="none" stroke="#0A5C4A" stroke-width="1.2" opacity="0.3"/>
  <circle cx="134" cy="79" r="16" fill="none" stroke="#0A5C4A" stroke-width="0.8" opacity="0.15"/>

  <!-- Technician avatar pin (moving) -->
  <circle cx="200" cy="120" r="13" fill="#0A5C4A"/>
  <circle cx="200" cy="116" r="4.5" fill="#FDBCB4"/>
  <rect x="193" y="121" width="14" height="10" rx="4" fill="white"/>
  <!-- White coat cross -->
  <line x1="200" y1="122" x2="200" y2="130" stroke="#0A5C4A" stroke-width="1.2"/>
  <line x1="196" y1="126" x2="204" y2="126" stroke="#0A5C4A" stroke-width="1.2"/>

  <!-- ETA badge -->
  <rect x="152" y="140" width="58" height="16" rx="8" fill="#0A5C4A"/>
  <text x="181" y="151" font-size="7.5" fill="white" font-family="sans-serif" text-anchor="middle" font-weight="bold">ETA · 8 mins</text>

  <!-- Bottom info strip -->
  <rect x="82" y="162" width="158" height="48" rx="0" fill="white"/>
  <path d="M82,162 L240,162 L240,196 Q240,210 226,210 L96,210 Q82,210 82,196 Z" fill="white"/>
  <circle cx="100" cy="180" r="9" fill="#E0F2EE"/>
  <!-- Technician tiny icon in circle -->
  <circle cx="100" cy="177" r="3" fill="#0A5C4A"/>
  <rect x="96" y="181" width="8" height="6" rx="2" fill="#0A5C4A"/>
  <text x="116" y="177" font-size="8" fill="#0A5C4A" font-family="sans-serif" font-weight="bold">Ravi K. — On the way</text>
  <text x="116" y="189" font-size="7" fill="#888" font-family="sans-serif">Live · 1.2 km away</text>
  <!-- green dot live indicator -->
  <circle cx="110" cy="195" r="3" fill="#2ECC71"/>
  <text x="117" y="198" font-size="7" fill="#555" font-family="sans-serif">Tracking active</text>

  <!-- Person figure left -->
  <circle cx="38" cy="138" r="12" fill="#FDBCB4"/>
  <ellipse cx="38" cy="130" rx="11" ry="6" fill="#2D1B00"/>
  <rect x="29" y="150" width="18" height="26" rx="6" fill="#1A7A63"/>
  <line x1="29" y1="158" x2="20" y2="170" stroke="#FDBCB4" stroke-width="5" stroke-linecap="round"/>
  <line x1="47" y1="158" x2="55" y2="165" stroke="#FDBCB4" stroke-width="5" stroke-linecap="round"/>
  <line x1="35" y1="176" x2="32" y2="196" stroke="#0A5C4A" stroke-width="5" stroke-linecap="round"/>
  <line x1="41" y1="176" x2="44" y2="196" stroke="#0A5C4A" stroke-width="5" stroke-linecap="round"/>

  <!-- Floating plus signs -->
  <text x="260" y="62" font-size="18" fill="#0A5C4A" opacity="0.27" font-weight="bold">+</text>
  <text x="18" y="100" font-size="14" fill="#0A5C4A" opacity="0.2" font-weight="bold">+</text>
  <text x="272" y="210" font-size="12" fill="#0A5C4A" opacity="0.18" font-weight="bold">+</text>
</svg>
